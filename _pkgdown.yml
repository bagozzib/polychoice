url: https://bagozzib.github.io/polychoice/

template:
  bootstrap: 5
  bslib:
    primary: "#2C3E50"

home:
  title: "polychoice: Multinomial Choice, Inflated Multinomial Logit, and Tests of IIA"
  description: >
    Multinomial choice models for R: the multinomial and conditional logit,
    the inflated multinomial logit, the nested logit, the heteroskedastic
    extreme value model, the multinomial probit, random alternative-specific
    intercepts, and the rank-ordered logit, with tests of the independence of
    irrelevant alternatives, parametric-bootstrap calibration, exact checks
    of separation, and one set of quantities of interest for every model.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/polychoice.html
    articles:
      text: Articles
      menu:
        - text: Getting started with polychoice
          href: articles/polychoice.html
        - text: Testing IIA and specification
          href: articles/iia.html
        - text: The inflated multinomial logit
          href: articles/inflation.html
        - text: "Beyond IIA: nested logit, HEV, multinomial probit, random intercepts, and panels"
          href: articles/beyond.html
        - text: Seven published analyses
          href: articles/applications.html

